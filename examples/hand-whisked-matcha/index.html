<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15291f">
  <meta name="description" content="青沫 AOAWA 的互動抹茶手記，從篩粉、注水到用竹茶筅刷出細沫。">
  <title>青沫 AOAWA — Whisked by Hand</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/typography.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.min.js"}}
  </script>
  <script type="module" src="story.mjs"></script>
</head>
<body>
  <main class="story" aria-label="青沫手刷抹茶">
    <span class="anchor" id="start" aria-hidden="true"></span>
    <span class="anchor" id="sift" aria-hidden="true"></span>
    <span class="anchor" id="pour" aria-hidden="true"></span>
    <span class="anchor" id="whisk" aria-hidden="true"></span>
    <span class="anchor" id="serve" aria-hidden="true"></span>

    <div class="stage">
      <figure class="visual">
        <div class="scene-background" aria-hidden="true"></div>
        <div class="scene-paper" aria-hidden="true"></div>
        <div class="scene-grain" aria-hidden="true"></div>
        <picture class="scene-poster" aria-hidden="true">
          <source media="(max-width: 767px)" srcset="assets/sift-mobile.webp">
          <img class="scene-image" src="assets/sift-desktop.webp" alt="">
        </picture>
        <canvas class="scene" aria-hidden="true"></canvas>
        <figcaption>竹茶筅・陶茶碗</figcaption>
      </figure>

      <header class="masthead">
        <a class="brand" href="#start" aria-label="青沫，回到開頭">
          <span lang="en">AOAWA</span><span class="brand-name">青沫</span>
        </a>
        <span class="edition">抹茶手記</span>
      </header>

      <div class="spread">
        <div class="copy">
          <article class="chapter" data-chapter="sift">
            <p class="eyebrow">手刷抹茶</p>
            <h1 lang="en">Whisked<br><em>by hand.</em></h1>
            <p class="description">將抹茶篩進茶碗，讓細粉更容易拌勻。</p>
            <a class="action" href="#sift">
              開始沖泡
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M12 4v15m-5-5 5 5 5-5"/>
              </svg>
            </a>
          </article>
          <article class="chapter" data-chapter="pour" hidden>
            <p class="eyebrow">注水</p>
            <h2 lang="en">A ribbon<br><em>of water.</em></h2>
            <p class="description">熱水緩緩入碗，先潤濕抹茶粉。</p>
          </article>
          <article class="chapter" data-chapter="whisk" hidden>
            <p class="eyebrow">刷茶</p>
            <h2 lang="en">Into a<br><em>fine foam.</em></h2>
            <p class="description">手腕帶動茶筅來回刷動，讓細沫浮上茶面。</p>
          </article>
          <article class="chapter" data-chapter="serve" hidden>
            <p class="eyebrow">奉茶</p>
            <h2 lang="en">A bowl<br><em>of green.</em></h2>
            <p class="description">提起茶筅，趁泡沫還細時喝第一口。</p>
            <a class="action" href="#start">
              再刷一碗
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M3 12a9 9 0 1 1 2.65 6.36M3 12V5m0 7h7"/>
              </svg>
            </a>
          </article>
        </div>

      </div>

      <nav class="chapters" aria-label="沖泡章節">
        <ol>
          <li><a href="#sift" aria-current="step"><span>01</span><span>篩粉</span><span lang="en">Sift</span></a></li>
          <li><a href="#pour"><span>02</span><span>注水</span><span lang="en">Pour</span></a></li>
          <li><a href="#whisk"><span>03</span><span>刷茶</span><span lang="en">Whisk</span></a></li>
          <li><a href="#serve"><span>04</span><span>奉茶</span><span lang="en">Serve</span></a></li>
        </ol>
      </nav>
    </div>
  </main>
  <noscript><p>篩粉入碗，注入熱水，以茶筅來回刷出細沫後即可飲用。</p></noscript>
</body>
</html>
